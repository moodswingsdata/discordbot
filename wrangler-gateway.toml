name = "feelingsbot-gateway"
main = "./src/gateway-worker.js"
compatibility_date = "2024-09-23"

# Fire every 5 minutes to ensure the gateway stays connected.
# The Durable Object reconnects automatically if it was evicted.
[triggers]
crons = ["*/5 * * * *"]

[[durable_objects.bindings]]
name = "DISCORD_GATEWAY"
class_name = "DiscordGateway"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DiscordGateway"]

# [observability.logs]
# enabled = true
# invocation_logs = true

# Required secret — set once after deploying:
#   npx wrangler secret put DISCORD_TOKEN --config wrangler-gateway.toml
